syntax = "proto3";

package hookline.v1;

import "google/api/annotations.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

// TenantService manages tenants and their API keys. Admin key only.
service TenantService {
  rpc CreateTenant(CreateTenantRequest) returns (CreateTenantResponse) {
    option (google.api.http) = {
      post: "/v1/admin/tenants"
      body: "*"
    };
  }
  rpc GetTenant(GetTenantRequest) returns (GetTenantResponse) {
    option (google.api.http) = {get: "/v1/admin/tenants/{id}"};
  }
  rpc ListTenants(ListTenantsRequest) returns (ListTenantsResponse) {
    option (google.api.http) = {get: "/v1/admin/tenants"};
  }
  rpc UpdateTenant(UpdateTenantRequest) returns (UpdateTenantResponse) {
    option (google.api.http) = {
      patch: "/v1/admin/tenants/{id}"
      body: "tenant"
    };
  }
  rpc DisableTenant(DisableTenantRequest) returns (DisableTenantResponse) {
    option (google.api.http) = {
      post: "/v1/admin/tenants/{id}:disable"
      body: "*"
    };
  }
  rpc CreateApiKey(CreateApiKeyRequest) returns (CreateApiKeyResponse) {
    option (google.api.http) = {
      post: "/v1/admin/tenants/{tenant_id}/keys"
      body: "*"
    };
  }
  rpc ListApiKeys(ListApiKeysRequest) returns (ListApiKeysResponse) {
    option (google.api.http) = {get: "/v1/admin/tenants/{tenant_id}/keys"};
  }
  rpc RevokeApiKey(RevokeApiKeyRequest) returns (RevokeApiKeyResponse) {
    option (google.api.http) = {delete: "/v1/admin/tenants/{tenant_id}/keys/{id}"};
  }
}

message Tenant {
  string id = 1;
  string name = 2;
  // "active" or "disabled".
  string status = 3;
  int32 ingest_rps_limit = 4;
  int32 max_concurrency = 5;
  google.protobuf.Timestamp create_time = 6;
  google.protobuf.Timestamp update_time = 7;
}

message ApiKey {
  string id = 1;
  string tenant_id = 2;
  // First characters of the key, for display only.
  string key_prefix = 3;
  google.protobuf.Timestamp create_time = 4;
  google.protobuf.Timestamp last_used_time = 5;
  google.protobuf.Timestamp revoke_time = 6;
}

message CreateTenantRequest {
  string name = 1;
  int32 ingest_rps_limit = 2;
  int32 max_concurrency = 3;
}

message CreateTenantResponse {
  Tenant tenant = 1;
}

message GetTenantRequest {
  string id = 1;
}

message GetTenantResponse {
  Tenant tenant = 1;
}

message ListTenantsRequest {
  int32 page_size = 1;
  string page_token = 2;
}

message ListTenantsResponse {
  repeated Tenant tenants = 1;
  string next_page_token = 2;
}

message UpdateTenantRequest {
  string id = 1;
  Tenant tenant = 2;
  // Filled automatically from the JSON body keys by the REST gateway.
  google.protobuf.FieldMask update_mask = 3;
}

message UpdateTenantResponse {
  Tenant tenant = 1;
}

message DisableTenantRequest {
  string id = 1;
}

message DisableTenantResponse {
  Tenant tenant = 1;
}

message CreateApiKeyRequest {
  string tenant_id = 1;
}

message CreateApiKeyResponse {
  ApiKey api_key = 1;
  // The full key. Shown only once.
  string key = 2;
}

message ListApiKeysRequest {
  string tenant_id = 1;
}

message ListApiKeysResponse {
  repeated ApiKey api_keys = 1;
}

message RevokeApiKeyRequest {
  string tenant_id = 1;
  string id = 2;
}

message RevokeApiKeyResponse {}
