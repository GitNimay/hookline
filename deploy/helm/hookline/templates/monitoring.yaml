{{- if .Values.metrics.prometheusRule }}
# Same rules as alerts/hookline.prom.yaml (copied into files/ by `make gen`).
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: hookline
  labels: {{- include "hookline.labels" (dict "root" $ "name" "alerts") | nindent 4 }}
spec:
{{ .Files.Get "files/alerts.yaml" | fromYaml | toYaml | indent 2 }}
{{- end }}
{{- if .Values.metrics.dashboards }}
---
# Grafana's dashboard sidecar loads ConfigMaps labelled grafana_dashboard=1.
apiVersion: v1
kind: ConfigMap
metadata:
  name: hookline-dashboards
  labels:
    grafana_dashboard: "1"
    {{- include "hookline.labels" (dict "root" $ "name" "dashboards") | nindent 4 }}
  annotations:
    grafana_folder: Hookline
data:
{{ (.Files.Glob "files/dashboards/*.json").AsConfig | indent 2 }}
{{- end }}
