# One-instance CloudNativePG cluster; services connect to hookline-pg-rw.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: hookline-pg
spec:
  instances: {{ .Values.postgres.instances }}
  imageName: {{ .Values.postgres.imageName }}
  postgresql:
    parameters:
      max_connections: {{ .Values.postgres.maxConnections | quote }}
      shared_buffers: {{ .Values.postgres.sharedBuffers | quote }}
      # Write-heavy tuning: timed checkpoints instead of forced ones.
      max_wal_size: 8GB
      min_wal_size: 1GB
      checkpoint_timeout: 15min
      checkpoint_completion_target: "0.9"
      wal_compression: lz4
      wal_buffers: 64MB
  bootstrap:
    initdb:
      database: hookline
      owner: hookline
      secret:
        name: {{ .Values.postgres.credentialsSecret }}
  storage:
    size: {{ .Values.postgres.storage }}
    {{- with .Values.postgres.storageClass }}
    storageClass: {{ . }}
    {{- end }}
  resources: {{- toYaml .Values.postgres.resources | nindent 4 }}
  monitoring:
    enablePodMonitor: true
