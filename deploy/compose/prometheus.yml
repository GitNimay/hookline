global:
  scrape_interval: 5s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts/*.prom.yaml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: hookline
    static_configs:
      - targets: ["ingest:8081", "control:8081", "dispatcher:8081", "worker:8081", "scheduler:8081", "chaos-customer:8081"]
    relabel_configs:
      - source_labels: [__address__]
        regex: "([^:]+):.*"
        target_label: service
  - job_name: nats
    static_configs:
      - targets: ["nats-exporter:7777"]
