# Hookline alert rules (plain Prometheus format). The Helm chart wraps the same groups in a
# PrometheusRule. Every alert links to its section in docs/runbook.md.
groups:
  - name: hookline.delivery
    rules:
      - alert: HooklineDeliverySuccessLow
        expr: |
          sum(rate(hookline_delivery_attempts_total{outcome="success"}[5m]))
            / sum(rate(hookline_delivery_attempts_total[5m])) < 0.95
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: Delivery success rate below 95%
          description: "Only {{ $value | humanizePercentage }} of delivery attempts succeeded over 5m."
          runbook_url: https://github.com/GitNimay/hookline/blob/main/docs/runbook.md#hooklinedeliverysuccesslow
      - alert: HooklineDeliverySuccessCritical
        expr: |
          sum(rate(hookline_delivery_attempts_total{outcome="success"}[5m]))
            / sum(rate(hookline_delivery_attempts_total[5m])) < 0.80
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: Delivery success rate below 80%
          description: "Only {{ $value | humanizePercentage }} of delivery attempts succeeded over 5m."
          runbook_url: https://github.com/GitNimay/hookline/blob/main/docs/runbook.md#hooklinedeliverysuccesslow
      - alert: HooklineDeadLettersRising
        expr: sum(increase(hookline_deliveries_dead_total[1h])) > 100
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: More than 100 dead letters in the last hour
          description: "{{ $value }} deliveries went dead in the last hour."
          runbook_url: https://github.com/GitNimay/hookline/blob/main/docs/runbook.md#hooklinedeadlettersrising

  # SLO: 99.5% of attempts start within 60 s of their due time. Budget = 0.5%.
  - name: hookline.slo
    rules:
      - record: hookline:slo_errors:ratio_rate5m
        expr: 1 - (sum(rate(hookline_delivery_schedule_lag_seconds_bucket{le="60"}[5m])) / sum(rate(hookline_delivery_schedule_lag_seconds_count[5m])))
      - record: hookline:slo_errors:ratio_rate30m
        expr: 1 - (sum(rate(hookline_delivery_schedule_lag_seconds_bucket{le="60"}[30m])) / sum(rate(hookline_delivery_schedule_lag_seconds_count[30m])))
      - record: hookline:slo_errors:ratio_rate1h
        expr: 1 - (sum(rate(hookline_delivery_schedule_lag_seconds_bucket{le="60"}[1h])) / sum(rate(hookline_delivery_schedule_lag_seconds_count[1h])))
      - record: hookline:slo_errors:ratio_rate6h
        expr: 1 - (sum(rate(hookline_delivery_schedule_lag_seconds_bucket{le="60"}[6h])) / sum(rate(hookline_delivery_schedule_lag_seconds_count[6h])))
      - alert: HooklineSLOFastBurn
        expr: hookline:slo_errors:ratio_rate1h > (14.4 * 0.005) and hookline:slo_errors:ratio_rate5m > (14.4 * 0.005)
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: Delivery SLO burning fast (2% of the monthly budget per hour)
          description: "{{ $value | humanizePercentage }} of attempts started more than 60 s late."
          runbook_url: https://github.com/GitNimay/hookline/blob/main/docs/runbook.md#hooklineslofastburn
      - alert: HooklineSLOSlowBurn
        expr: hookline:slo_errors:ratio_rate6h > (6 * 0.005) and hookline:slo_errors:ratio_rate30m > (6 * 0.005)
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: Delivery SLO burning slowly (5% of the monthly budget per 6 h)
          description: "{{ $value | humanizePercentage }} of attempts started more than 60 s late."
          runbook_url: https://github.com/GitNimay/hookline/blob/main/docs/runbook.md#hooklineslofastburn

  - name: hookline.queues
    rules:
      - alert: HooklineOutboxBacklog
        expr: max(hookline_outbox_pending) > 1000
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: Outbox not draining (relay stuck or NATS down)
          description: "{{ $value }} events are stored but not queued."
          runbook_url: https://github.com/GitNimay/hookline/blob/main/docs/runbook.md#hooklineoutboxbacklog
      - alert: HooklineDeliveriesLag
        expr: sum(jetstream_consumer_num_pending{stream_name="DELIVERIES"}) > 10000
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: More than 10,000 delivery jobs waiting
          description: "{{ $value }} jobs pending across tenant consumers."
          runbook_url: https://github.com/GitNimay/hookline/blob/main/docs/runbook.md#hooklinedeliverieslag

  - name: hookline.platform
    rules:
      - alert: HooklineServiceDown
        expr: up{service=~"ingest|control|dispatcher|worker|scheduler"} == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.service }} is down"
          description: "Prometheus cannot scrape {{ $labels.instance }}."
          runbook_url: https://github.com/GitNimay/hookline/blob/main/docs/runbook.md#hooklineservicedown
      - alert: HooklinePodRestarting
        expr: increase(kube_pod_container_status_restarts_total{namespace="hookline"}[15m]) > 3
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.pod }} restarted more than 3 times in 15m"
          description: Possible crash loop.
          runbook_url: https://github.com/GitNimay/hookline/blob/main/docs/runbook.md#hooklinepodrestarting
      - alert: HooklinePostgresConnectionsHigh
        expr: sum(pg_stat_activity_count) / max(pg_settings_max_connections) > 0.8
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: Postgres connections above 80% of max
          description: "{{ $value | humanizePercentage }} of max_connections in use."
          runbook_url: https://github.com/GitNimay/hookline/blob/main/docs/runbook.md#hooklinepostgresconnectionshigh
